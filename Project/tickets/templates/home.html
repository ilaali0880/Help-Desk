{% extends 'base.html' %}
{% block title %}لیست تیکت‌ها{% endblock %}
{% block page_class %}page-home{% endblock %}

{% block content %}
    <h2><i class="fa-solid fa-ticket"></i> لیست تیکت‌ها</h2>

    <form method="get" class="filter-form">
        <input type="text" name="q" placeholder="جستجو در عنوان..." value="{{ request.GET.q }}">
        <select name="status">
            <option value="">همه وضعیت‌ها</option>
            {% for value, label in status_choices %}
                <option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <button type="submit"><i class="fa-solid fa-filter"></i> اعمال فیلتر</button>
    </form>

    <div id="ticket-results">
        {% include 'partials/ticket_list_partial.html' %}
    </div>
{% endblock %}
